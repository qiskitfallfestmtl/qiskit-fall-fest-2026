<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackathon — Qiskit Fall Fest 2026 at Polytechnique Montréal</title>
<meta name="description" content="Format, critères d'évaluation et préparation du hackathon quantique du Qiskit Fall Fest 2026 à Polytechnique Montréal.">
<link rel="canonical" href="https://pkeyela.github.io/qiskit-fall-fest-2026/hackathon.html">
<meta property="og:title" content="Hackathon — Qiskit Fall Fest 2026 at Polytechnique Montréal">
<meta property="og:description" content="Une journée. Un énoncé. Votre équipe.">
<meta property="og:image" content="https://pkeyela.github.io/qiskit-fall-fest-2026/assets/img/og-image.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#31135e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
<div id="site-header"></div>

<main id="main">
  <section class="page-hero">
    <img class="page-hero__bg" src="assets/img/hero.svg" alt="" aria-hidden="true">
    <div class="wrap">
      <p class="eyebrow" data-i18n="hack.eyebrow"></p>
      <h1 data-i18n="hack.title"></h1>
      <p class="section__lede" data-i18n="hack.lede"></p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid-2">
        <div class="card reveal">
          <h2 class="card__t" data-i18n="hack.rules.title"></h2>
          <ul class="ticks">
            <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="hack.r1"></span></li>
            <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="hack.r2"></span></li>
            <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="hack.r3"></span></li>
            <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="hack.r4"></span></li>
          </ul>
          <div class="callout">
            <strong data-i18n="hack.prep.title"></strong><br>
            <span data-i18n="hack.prep.d"></span><br>
            <span data-i18n="hack.prep.note" style="opacity:.85"></span>
          </div>
        </div>

        <div class="card reveal">
          <h2 class="card__t" data-i18n="hack.judge.title"></h2>
          <div class="criteria">
            <div class="crit"><p class="crit__t" data-i18n="hack.j1.t"></p><p class="crit__d" data-i18n="hack.j1.d"></p></div>
            <div class="crit"><p class="crit__t" data-i18n="hack.j2.t"></p><p class="crit__d" data-i18n="hack.j2.d"></p></div>
            <div class="crit"><p class="crit__t" data-i18n="hack.j3.t"></p><p class="crit__d" data-i18n="hack.j3.d"></p></div>
            <div class="crit"><p class="crit__t" data-i18n="hack.j4.t"></p><p class="crit__d" data-i18n="hack.j4.d"></p></div>
          </div>
          <p style="margin-top:var(--sp-6);text-align:center">
            <a class="btn btn--ghost btn--sm" href="program.html" data-i18n="hero.cta2"></a>
          </p>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/js/content.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
